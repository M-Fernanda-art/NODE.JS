<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODE JS</title>
</head>
<body>
    
    <!-- QUE ES NODE JS -->

    <h1>Registro</h1>

    <form id="formulario">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <br><br>

        <input type="email" id="correo" placeholder="correo" required>
        <br><br>

        <button type="submit">Enviar</button>
    </form>

    <p id="mensaje"></p>

    <!-- INICIAR SESIÓN -->

    <h1>Iniciar Sesión</h1>

    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="clave" placeholder="contraseña">

    <button onclick="iniciarSesion()">Ingresar</button>

    <p id="resultado2"></p>



    <!-- EJEMPLO 2 - LISTA DE PRODUCTOS -->

    <h1>Productos Disponibles</h1>

    <button id="boton">Mostrar productos</button>

    <ul id="lista"></ul>
    

    <!-- EJEMPLO 3 - COMENTARIOS -->

<h1>Sistema de Comentarios</h1>

<input type="text" id="comentario" placeholder="Escribe un comentario">

<button id="enviar">Agregar</button>

<h2>Comentarios</h2>

<ul id="lista2"></ul>

<h1>productos</h1>

</body>
</html>
